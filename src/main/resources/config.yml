#The language to default to if a player's client is set to a non-supported language.
#If you're going to change this, make sure to set it lo one supported by this plugin or to an existing custom one
#inside the ./translations folder.
defaultLanguage: "en"

#Optional isolated void world for unauthenticated players.
hold_world:
  #When disabled, held players remain in their current world.
  enabled: false
  #Existing world to load, or new void-world directory to create.
  name: "accwarden_hold"
  #Bukkit world environment: NORMAL, NETHER, or THE_END.
  dimension: "NORMAL"

#If enabled, every Bedrock login will be linked through Floodgate to the offline Java UUID for its Java-side name.
#Bedrock and Java will share the same password and payer data/progress.
# - 'username-prefix' setting in the Floodgate config file must be set to an empty string ("").
# - Local linking storage must be configured in Floodgate.
# - Floodgate linking commands must be disabled.
playerNameAutoLinking: false

sessions:
  #If a player leaves the game, how long to keep their session alive, so they don't have to re-enter their password.
  #as long as they re-join from the same IP address. In seconds. 0 or less will disable this feature.
  #Cached sessions are bound to the edition they authenticated from and never transfer between Java and Bedrock.
  holdTime: 300

password_format:
  min_length: 4
  max_length: 12

#Rate limits and abuse detection for connections and account logins.
#Durations are measured in seconds. All configured values must be greater than zero.
security_policies:
  #Distinct networks that trigger an advisory warning for one account.
  multi_client_account_warning_count: 5

  client_connections_limit:
    #When false, only the global connections limit can throttle connections.
    enabled: true
    #How long connection activity remains in the client and account histories.
    expiration_seconds: 60
    #Accepted connections allowed from one network during the expiration window.
    limit: 20
    #Connections accepted across all networks during the expiration window.
    #This is also the maximum size of the client and account histories.
    global_limit: 1000
    #How long the client remains throttled after reaching the limit.
    penalty_seconds: 300

  client_login_limit:
    #When false, this policy does not limit login attempts.
    enabled: true
    #How long login requests and incorrect-password attempts remain in history.
    expiration_seconds: 600
    #Failed-password count that starts showing unusual-activity feedback.
    odd: 3
    #Failed-password count that warns about imminent network throttling.
    warn: 4
    #Login requests per account/network pair, or failed passwords per network,
    #allowed during the expiration window before the network is throttled.
    limit: 5
    #How long the network remains throttled after reaching the limit.
    penalty_seconds: 1200
