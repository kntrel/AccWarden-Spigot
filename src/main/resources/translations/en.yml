    auto_name_link_failed: "We couldn't link your Bedrock account to its Java identity. Please try again."

  not_allowed:
    send_message: "You're not allowed to send messages until logged in."
    issue_command: "You're not allowed issue commands until logged in."

  invalid_input:
    no_match: "Passwords do not match!"
    non_confirmed: "Missing confirmation!"
    too_short: "Your password cannot have less than {min} characters."
    too_long: "Your password cannot have more than {max} characters."

  incorrect_password:
    fine: "Wrong password!"
    odd: "Wrong password! Contact the admins if you're having trouble logging in."
    warn: "Wrong password! Your network is about to be temporarily throttled."

info:
  logged_in: "Logged in!"
  account_deleted: "Your account has been deleted. Pleaser re-join."
